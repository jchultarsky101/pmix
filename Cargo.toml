[package]
name = "pmix"
version = "0.16.1"
edition = "2024"
rust-version = "1.85"
description = "Read STEP AP242 and JT files: their PMI and metadata, the features their shapes are made of, and the parts they contain, as stable comparable JSON"
authors = ["Julian Chultarsky <jchultarsky@physna.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/jchultarsky101/pmix"
homepage = "https://github.com/jchultarsky101/pmix"
documentation = "https://docs.rs/pmix"
keywords = ["step", "jt", "pmi", "cad", "gdt"]
categories = ["command-line-utilities", "parser-implementations", "science"]
exclude = [".github/", "tests/", "CLAUDE.md", ".editorconfig", ".gitattributes", "rustfmt.toml"]

[lib]
name = "pmix"
path = "src/lib.rs"

[[bin]]
name = "pmix"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Pure-Rust XZ decoder: JT 10 segments are XZ compressed and a C
# dependency would break cross-compilation for the release targets.
lzma-rs = "0.3"
# Pure-Rust ZLIB decoder, for the same reason: JT 9 and older compress
# their segments with ZLIB rather than XZ.
miniz_oxide = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Release code with symbols, so a profiler can name what it samples. The
# release profile strips them, which is why this profile exists.
[profile.profiling]
inherits = "release"
debug = true
strip = false

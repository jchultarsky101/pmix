[package]
name = "pmix"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Extract Product Manufacturing Information (PMI) from STEP and JT files into JSON, and compare it across models"
authors = ["Julian Chultarsky <jchultarsky@physna.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/jchultarsky101/pmix"
homepage = "https://github.com/jchultarsky101/pmix"
documentation = "https://docs.rs/pmix"
keywords = ["step", "jt", "pmi", "cad", "gdt"]
categories = ["command-line-utilities", "parser-implementations", "science"]
exclude = [".github/", "tests/", "CLAUDE.md", ".editorconfig", ".gitattributes", "rustfmt.toml"]

[lib]
name = "pmix"
path = "src/lib.rs"

[[bin]]
name = "pmix"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
